name: readquest-workstation
services:
  desktop:
    image: readquest-dev-xrdp:v1
    container_name: readquest-dev-xrdp
    environment:
      RDP_PASSWORD: ${RDP_PASSWORD:?Set RDP_PASSWORD in .env}
      DEV_UID: ${DEV_UID:?Set DEV_UID in .env}
      DEV_GID: ${DEV_GID:?Set DEV_GID in .env}
      INSTALL_VSCODE: ${INSTALL_VSCODE:?Set INSTALL_VSCODE in .env}
    stdin_open: true
    tty: true
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3390:3389"

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${READQUEST_DIR:?Set READQUEST_DIR in .env}
        target: /workspace/readquest
      - type: bind
        source: ${READQUEST_DIR:?Set READQUEST_DIR in .env}
        target: ${READQUEST_DIR:?Set READQUEST_DIR in .env}
      - developer_home:/home/developer

    secrets:
      - rdp_password

    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3389"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  developer_home:

secrets:
  rdp_password:
    file: ./.secrets/rdp_password.txt
